<h2>Octicia the Cunning</h2>

<p>She was born with gray pale skin and yellow eyes. Everyone acted like that was normal, even though her mother and
    mother had fair skin and blue eyes. But over the years, the differences began to manifest, and she knew something
    was off.</p>
